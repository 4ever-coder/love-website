<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#aaa0bd">
  <meta name="description" content="一页写给彼此的七夕情侣纪念网页">
  <title>七夕情侣纪念网页</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="bubu.svg" type="image/svg+xml">
  <script src="config.js"></script>
</head>
<body>
  <div class="ambient-layer" aria-hidden="true"></div>

  <div class="music-control" id="musicControl" hidden>
    <button class="icon-button" id="musicToggle" type="button" aria-label="" title="">
      <span class="music-icon" id="musicIcon" aria-hidden="true">♪</span>
      <span class="sr-only" id="musicLabel">播放音乐</span>
    </button>
    <audio id="bgMusic" loop preload="none"></audio>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <main class="site-shell">
    <section class="hero is-visible" id="cover" data-background-key="cover" aria-labelledby="coverTitle">
      <div class="section-background" aria-hidden="true"></div>
      <div class="hero-topline">
        <span class="hero-mark">QIXI / 01</span>
        <span class="hero-season">A MEMORY FOR TWO</span>
      </div>

      <div class="hero-content reveal-item is-in-view">
        <p class="eyebrow" id="coverEyebrow"></p>
        <h1 id="coverTitle"></h1>

        <div class="couple-line" aria-label="情侣姓名">
          <button class="person-card" id="partnerCard" type="button" data-person="partner">
            <span class="person-avatar"><img id="partnerAvatar" alt=""></span>
            <span class="person-copy">
              <strong id="partnerName"></strong>
              <small id="partnerRole"></small>
            </span>
          </button>

          <span class="couple-separator" aria-hidden="true">·</span>

          <button class="person-card" id="youCard" type="button" data-person="you">
            <span class="person-avatar"><img id="yourAvatar" alt=""></span>
            <span class="person-copy">
              <strong id="yourName"></strong>
              <small id="yourRole"></small>
            </span>
          </button>
        </div>

        <p class="hero-subtitle" id="coverSubtitle"></p>
      </div>

      <a class="scroll-hint" href="#timer">
        <span id="scrollHint"></span>
        <span class="scroll-line" aria-hidden="true"></span>
      </a>
    </section>

    <section class="section timer-section" id="timer" data-background-key="timer" aria-labelledby="timerHeading">
      <div class="section-background" aria-hidden="true"></div>
      <div class="section-heading section-heading--center reveal-item">
        <p class="eyebrow">TIME TOGETHER</p>
        <h2 id="timerHeading"></h2>
        <p class="section-intro" id="timerSuffix"></p>
      </div>

      <div class="timer-grid reveal-item" aria-label="恋爱时长">
        <div class="time-unit"><strong id="daysValue">0</strong><span>天</span></div>
        <div class="time-unit"><strong id="hoursValue">0</strong><span>小时</span></div>
        <div class="time-unit"><strong id="minutesValue">0</strong><span>分钟</span></div>
        <div class="time-unit"><strong id="secondsValue">0</strong><span>秒</span></div>
      </div>

      <div class="kiss-widget reveal-item">
        <span class="kiss-count" id="kissCount">0</span>
        <span class="kiss-copy"><span id="kissLabel"></span><small id="kissHint"></small></span>
        <button class="text-button" id="kissButton" type="button"></button>
      </div>
    </section>

    <section class="section timeline-section" id="timeline" data-background-key="timeline" aria-labelledby="timelineTitle">
      <div class="section-background" aria-hidden="true"></div>
      <div class="section-heading reveal-item">
        <p class="eyebrow">THE DAYS WE KEEP</p>
        <h2 id="timelineTitle"></h2>
        <p class="section-intro" id="timelineIntro"></p>
      </div>
      <ol class="timeline-list reveal-item" id="timelineList"></ol>
    </section>

    <section class="section photos-section" id="photos" data-background-key="photos" aria-labelledby="photosTitle">
      <div class="section-background" aria-hidden="true"></div>
      <div class="section-heading reveal-item">
        <p class="eyebrow">OUR LITTLE ARCHIVE</p>
        <h2 id="photosTitle"></h2>
        <p class="section-intro" id="photosIntro"></p>
      </div>
      <div class="photo-grid reveal-item" id="photoGrid"></div>
    </section>

    <section class="section letter-section" id="letter" data-background-key="letter" aria-labelledby="letterTitle">
      <div class="section-background" aria-hidden="true"></div>
      <div class="letter-shell reveal-item">
        <p class="eyebrow" id="letterEyebrow"></p>
        <div class="letter-card" id="letterCard">
          <div class="envelope-seal" aria-hidden="true">七</div>
          <div class="letter-cover">
            <span class="letter-cover-line"></span>
            <span class="letter-cover-label" id="letterHint"></span>
          </div>

          <div class="letter-content" id="letterContent" hidden>
            <h2 id="letterTitle"></h2>
            <div class="letter-body" id="letterBody"></div>
            <p class="letter-signature" id="letterSignature"></p>
          </div>

          <button class="outline-button" id="letterToggle" type="button" aria-expanded="false" aria-controls="letterContent">
            <span id="letterButtonText"></span>
          </button>
        </div>
      </div>
    </section>

    <section class="section surprise-section" id="surprise" data-background-key="surprise" aria-labelledby="surpriseHeading">
      <div class="section-background surprise-background" aria-hidden="true"></div>
      <div class="surprise-content surprise-card reveal-item">
        <p class="eyebrow" id="surpriseEyebrow"></p>
        <p class="surprise-prompt" id="surprisePrompt"></p>
        <button class="primary-button" id="surpriseButton" type="button"></button>

        <div class="surprise-reveal" id="surpriseReveal" hidden>
          <span class="reveal-rule" aria-hidden="true"></span>
          <h2 id="surpriseHeading"></h2>
          <p id="surpriseMessage"></p>
        </div>
      </div>
      <canvas class="celebrationCanvas" id="celebrationCanvas" aria-hidden="true"></canvas>
    </section>
  </main>

  <dialog class="photo-dialog" id="photoDialog" aria-labelledby="photoDialogCaption">
    <button class="dialog-close" id="photoDialogClose" type="button" aria-label="">×</button>
    <img id="photoDialogImage" alt="">
    <div class="dialog-meta">
      <span id="photoDialogDate"></span>
      <p id="photoDialogCaption"></p>
    </div>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
